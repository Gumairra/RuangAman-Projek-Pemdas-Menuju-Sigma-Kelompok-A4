<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Suhu Ruangan</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
    </style>
    <link rel="stylesheet" href="web.css">

</head>
<body>
    <div class="connection-status" id="connectionStatus">● Terhubung</div>
    
    <div class="container">
        <header>
            <h1>🌡️ Sistem Manajemen Suhu Ruangan</h1>
            <div class="status-badge" id="statusBadge">Normal</div>
            <div style="margin-top: 15px; color: #666;">
                <small id="lastUpdate">Memuat data...</small>
            </div>
        </header>

        <div class="dashboard">
            <!-- Card Suhu -->
            <div class="card">
                <h2>🌡️ Suhu Ruangan</h2>
                <div class="sensor-display">
                    <div class="sensor-value" id="temperature">--</div>
                    <div class="sensor-unit">°C</div>
                </div>
                <div class="info-item" style="margin-top: 20px;">
                    <div class="info-label">Target Suhu</div>
                    <div class="info-value" id="targetTemp">28°C</div>
                </div>
            </div>

            <!-- Card Kelembaban -->
            <div class="card">
                <h2>💧 Kelembaban</h2>
                <div class="sensor-display">
                    <div class="sensor-value" id="humidity">--</div>
                    <div class="sensor-unit">%</div>
                </div>
                <div class="info-item" style="margin-top: 20px;">
                    <div class="info-label">Status Kelembaban</div>
                    <div class="info-value" id="humidityStatus">Normal</div>
                </div>
            </div>

            <!-- Card Kontrol -->
            <div class="card">
                <h2>⚙️ Kontrol Sistem</h2>
                
                <div class="control-group">
                    <label>
                        Mode Otomatis
                        <label class="switch" style="float: right;">
                            <input type="checkbox" id="autoMode" checked onchange="toggleMode()">
                            <span class="slider"></span>
                        </label>
                    </label>
                </div>

                <div class="control-group" id="manualControls" style="display: none;">
                    <label>
                        Kipas Manual
                        <label class="switch" style="float: right;">
                            <input type="checkbox" id="fanManual" onchange="toggleFan()">
                            <span class="slider"></span>
                        </label>
                    </label>
                </div>

                <div class="control-group">
                    <label for="targetInput">Target Suhu (°C)</label>
                    <input type="number" id="targetInput" value="28" min="20" max="35" step="0.5">
                    <button onclick="setTarget()" style="width: 100%; margin-top: 10px;">Atur Target</button>
                </div>

                <div class="info-grid" style="margin-top: 20px;">
                    <div class="info-item">
                        <div class="info-label">Mode</div>
                        <div class="info-value" id="modeDisplay">Auto</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Kipas</div>
                        <div class="info-value" id="fanStatus">Mati</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Card Grafik -->
        <div class="card">
            <h2>📊 Grafik Real-time</h2>
            <div class="chart-container">
                <canvas id="tempChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Inisialisasi Socket.IO
        const socket = io();
        
        // Variabel untuk chart
        let tempChart;
        const maxDataPoints = 30;
        let chartData = {
            labels: [],
            temp: [],
            humidity: []
        };

        // Setup Chart
        function initChart() {
            const ctx = document.getElementById('tempChart').getContext('2d');
            tempChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData.labels,
                    datasets: [{
                        label: 'Suhu (°C)',
                        data: chartData.temp,
                        borderColor: '#ef4444',
                        backgroundColor: 'rgba(239, 68, 68, 0.1)',
                        tension: 0.4
                    }, {
                        label: 'Kelembaban (%)',
                        data: chartData.humidity,
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        // Update Chart
        function updateChart(temp, humidity) {
            const now = new Date().toLocaleTimeString('id-ID');
            
            chartData.labels.push(now);
            chartData.temp.push(temp);
            chartData.humidity.push(humidity);
            
            if (chartData.labels.length > maxDataPoints) {
                chartData.labels.shift();
                chartData.temp.shift();
                chartData.humidity.shift();
            }
            
            tempChart.update();
        }

        // Socket Events
        socket.on('connect', () => {
            document.getElementById('connectionStatus').textContent = '● Terhubung';
            document.getElementById('connectionStatus').classList.remove('disconnected');
        });

        socket.on('disconnect', () => {
            document.getElementById('connectionStatus').textContent = '● Terputus';
            document.getElementById('connectionStatus').classList.add('disconnected');
        });

        socket.on('update_data', (data) => {
            document.getElementById('temperature').textContent = data.temperature;
            document.getElementById('humidity').textContent = data.humidity;
            
            const statusBadge = document.getElementById('statusBadge');
            statusBadge.textContent = data.status;
            statusBadge.className = 'status-badge status-' + data.status.toLowerCase();
            
            document.getElementById('lastUpdate').textContent = 
                'Update terakhir: ' + new Date().toLocaleTimeString('id-ID');
            
            // Update humidity status
            const humStatus = data.humidity < 40 ? 'Kering' : 
                            data.humidity > 70 ? 'Lembab' : 'Normal';
            document.getElementById('humidityStatus').textContent = humStatus;
            
            // Update fan status
            if (data.temperature >= 28) {
                document.getElementById('fanStatus').textContent = 'Nyala';
            } else {
                document.getElementById('fanStatus').textContent = 'Mati';
            }
            
            // Update chart
            updateChart(data.temperature, data.humidity);
        });

        // Toggle Mode
        function toggleMode() {
            const autoMode = document.getElementById('autoMode').checked;
            document.getElementById('manualControls').style.display = autoMode ? 'none' : 'block';
            document.getElementById('modeDisplay').textContent = autoMode ? 'Auto' : 'Manual';
            
            fetch('/api/set_mode', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({auto: autoMode})
            });
        }

        // Toggle Fan
        function toggleFan() {
            const fanOn = document.getElementById('fanManual').checked;
            
            fetch('/api/set_kipas', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({on: fanOn})
            });
        }

        // Set Target Temperature
        function setTarget() {
            const target = parseFloat(document.getElementById('targetInput').value);
            document.getElementById('targetTemp').textContent = target + '°C';
            
            fetch('/api/set_target', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({target: target})
            });
        }

        // Load initial data
        async function loadData() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                
                document.getElementById('temperature').textContent = data.temperature;
                document.getElementById('humidity').textContent = data.humidity;
                document.getElementById('targetTemp').textContent = data.target_temp + '°C';
                document.getElementById('autoMode').checked = data.mode_auto;
                document.getElementById('fanManual').checked = data.kipas_manual;
                
                toggleMode();
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        // Initialize
        window.onload = () => {
            initChart();
            loadData();
        };
    </script>
</body>
</html>
